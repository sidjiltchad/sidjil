name = "sidjil"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "sidjil.org", custom_domain = true },
  { pattern = "www.sidjil.org", custom_domain = true }
]

# قاعدة البيانات (D1) — الإنتاج
[[d1_databases]]
binding = "DB"
database_name = "SIDJIL"
database_id = "c129a877-d3c5-425c-995e-a6dbe0aa805c"
migrations_dir = "migrations"

# التخزين (R2) — الإنتاج
[[r2_buckets]]
binding = "FILES"
bucket_name = "sidjil-assets"

# الأصول الثابتة (CSS/JS/الشعار) — تُقدَّم مباشرة دون المرور بالـ Worker
[assets]
directory = "./public"
not_found_handling = "none"

[vars]
SITE_NAME = "سِجِل"
SITE_URL = "https://sidjil.org"
ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD_HASH يُضبط كسرّ (wrangler secret) ولا يوضع هنا أبدًا
