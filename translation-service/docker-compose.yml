services:
  translation-api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
